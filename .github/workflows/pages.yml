name: Deploy Cartigma to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Testar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Testar Cartigma
        run: node --test tests/*.test.mjs

      - name: Preparar arquivos estáticos
        run: |
          mkdir -p dist
          cp index.html styles.css themes.css mobile.css ranking.css ranking-client.js ranking-panel.html theme.js app.js country-catalog.js continent-borders.js atlas-i18n.js country-insights.js country-clues-i18n.js currency-denominations.js country-profile-i18n.js map-filters-i18n.js map-bootstrap.js map-fallback.js language-picker.js i18n.js clues-i18n.js compass-i18n.js report-i18n.js favicon.svg sitemap.xml robots.txt dist/
          # Refresh all versioned assets consistently after every release.
          sed -i -E "s|(\\?v=)[A-Za-z0-9_-]+|\\1${GITHUB_SHA}|g" dist/index.html
          touch dist/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4