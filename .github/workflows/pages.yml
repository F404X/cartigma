name: Deploy Cartigma to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Testar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Testar Cartigma
        run: node --test tests/*.test.mjs

      - name: Preparar arquivos estáticos
        run: |
          mkdir -p dist
          cp index.html styles.css themes.css mobile.css theme.js app.js continent-borders.js cities-extended.js city-indicators.js urban-2025.js city-clues-i18n.js atlas-i18n.js country-insights.js country-clues-i18n.js currency-denominations.js country-profile-i18n.js map-filters-i18n.js map-bootstrap.js map-fallback.js language-picker.js places.js references.js i18n.js clues-i18n.js compass-i18n.js report-i18n.js facts.js favicon.svg sitemap.xml robots.txt dist/
          # Fingerprint the public scripts on every deployment (not just once in source).
          sed -i "s|v=20261116-profile-diversity|v=${GITHUB_SHA}|g" dist/index.html
          sed -i "s|v=20261116-area-scope|v=${GITHUB_SHA}|g" dist/index.html
          sed -i "s|v=20261116-daily-navigation|v=${GITHUB_SHA}|g" dist/index.html
          sed -i "s|v=20261116-sea-access-fix|v=${GITHUB_SHA}|g" dist/index.html
          sed -i "s|v=20261116-currency-names|v=${GITHUB_SHA}|g" dist/index.html
          sed -i "s|v=20261116-short-currency|v=${GITHUB_SHA}|g" dist/index.html
          sed -i "s|v=20261116-retired-clues|v=${GITHUB_SHA}|g" dist/index.html
          sed -i "s|v=20261117-clean-overlays|v=${GITHUB_SHA}|g" dist/index.html
          sed -i "s|v=20261116-ten-evidence|v=${GITHUB_SHA}|g" dist/index.html
          sed -i "s|v=20261116-utm-ruler|v=${GITHUB_SHA}|g" dist/index.html
          sed -i "s|v=20261116-city-evidence|v=${GITHUB_SHA}|g" dist/index.html
          sed -i "s|v=20261116-city-archive|v=${GITHUB_SHA}|g" dist/index.html
          sed -i "s|v=20261116-latitude-overlay|v=${GITHUB_SHA}|g" dist/index.html
          sed -i "s|v=20261116-short-distances|v=${GITHUB_SHA}|g" dist/index.html
          touch dist/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4