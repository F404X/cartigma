name: Deploy Cartigma to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Testar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Testar Cartigma
        run: node --test tests/*.test.mjs

      - name: Preparar arquivos estáticos
        run: |
          mkdir -p dist
          cp index.html changelog.js changelog-data.js styles.css themes.css mobile.css theme.js app.js shared-clues.js country-catalog.js country-boundaries.geojson continent-borders.js atlas-i18n.js country-insights.js country-clues-i18n.js currency-denominations.js country-profile-i18n.js map-filters-i18n.js map-bootstrap.js map-fallback.js language-picker.js i18n.js clues-i18n.js compass-i18n.js report-i18n.js favicon.svg sitemap.xml robots.txt ranking.css ranking-client.js ranking-panel.html dist/
          # Refresh all versioned assets consistently after every release.
          sed -i -E "s|(\\?v=)[A-Za-z0-9_-]+|\\1${GITHUB_SHA}|g" dist/index.html
          touch dist/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4