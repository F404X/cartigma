name: Verify Cloudflare access (temporary)

on:
  push:
    branches: ["test/cloudflare-credentials"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Cloudflare token and D1 access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN is missing"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is missing"
            exit 1
          fi
          verify_response="$(curl --silent --show-error --fail --max-time 20 "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          if ! jq -e '.success == true and .result.status == "active"' <<< "$verify_response" >/dev/null; then
            echo "::error::Token inactive or invalid"
            exit 1
          fi
          echo "Cloudflare token is active"
          database_response="$(curl --silent --show-error --fail --max-time 20 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          if ! jq -e '.success == true' <<< "$database_response" >/dev/null; then
            echo "::error::D1 API returned an unsuccessful response"
            exit 1
          fi
          echo "Cloudflare D1 account access confirmed"
