name: Test public staging ranking flow
on:
  push:
    branches: ["feature/ranking"]
    paths: [".github/workflows/staging-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Smoke test preview, API and account lifecycle
        env:
          URL: https://cartigma-ranking-staging.foxythefox2017xd.workers.dev
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          const origin=process.env.URL;
          let cookie="";
          async function req(path,body){
            const r=await fetch(origin+path,{method:body===undefined?'GET':'POST',
              headers:{Origin:origin,...(body===undefined?{}:{'Content-Type':'application/json'}),
                ...(cookie?{Cookie:cookie}:{})},
              ...(body===undefined?{}:{body:JSON.stringify(body)})});
            const c=r.headers.get('set-cookie');
            if(c?.startsWith('__Host-cartigma_session='))cookie=c.split(';')[0];
            const data=(r.headers.get('content-type')||'').includes('application/json')?
              await r.json():await r.text();
            return {status:r.status,data,retryAfter:r.headers.get('retry-after')};
          }
          async function ok(path,body,status=200){
            const x=await req(path,body);
            assert.equal(x.status,status,path+": "+JSON.stringify(x.data).slice(0,220));
            return x.data;
          }
          (async()=>{
            assert.equal((await ok('/v1/health')).ok,true);
            const home=await ok('/');
            assert.match(home,/Cartigma/);
            assert.match(home,/ranking-client.js/);
            const stamp=Date.now().toString().slice(-11);
            assert.match(home,/rushStartBtn/);
            assert.match(home,/ranking-panel.html|ranking-client.js/);
            const username='stage'+stamp;
            const email=username+'@example.invalid';
            const password='CartigmaSmoke-Long-Passphrase-'+stamp;
            let created=false;
            try{
              const reg=await ok('/v1/auth/register',{username,email,password},201);
              created=true;
              assert.equal(reg.user.username,username);
              assert.equal((await ok('/v1/auth/me')).user.username,username);
              const start=await ok('/v1/games/start',{difficulty:'normal',mode:'free'},201);
              assert.equal(start.mode,'free');
              assert.equal(start.finished,false);
              assert.equal(start.clues.length,2);
              assert.equal('target' in start,false);
              const state=await ok('/v1/games/state',{id:start.id,playToken:start.playToken});
              assert.equal(state.finished,false);
              assert.equal('target' in state,false);
              assert.equal((await req('/v1/games/start',{difficulty:'normal',mode:'daily'})).status,409);
              const finish=await ok('/v1/games/finish',{id:start.id,playToken:start.playToken});
              assert.equal(finish.finished,true);
              assert.equal(finish.score,0);
              const saved=await ok('/v1/games/save',{id:start.id,playToken:start.playToken});
              assert.equal(saved.saved,true);
              const board=await req('/v1/leaderboards');
              assert.ok([200,429].includes(board.status),'Unexpected leaderboard status '+board.status);
              if(board.status===200){
                assert.ok(board.data.boards.normal.week);
                const repeated=await req('/v1/leaderboards');
                assert.equal(repeated.status,429);
                assert.equal(repeated.retryAfter,'180');
              }else{
                assert.equal(board.retryAfter,'180');
              }
              await ok('/v1/auth/logout',{});
              const login=await ok('/v1/auth/login',{email,password});
              assert.equal(login.user.username,username);
              console.log("PASS: preview, register/login, reserved free match, private target, save, 180s leaderboard cooldown");
            }finally{
              if(created){
                const deletion=await req('/v1/auth/delete',{password});
                console.log('Cleanup temporary test account:',deletion.status);
              }
            }
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
