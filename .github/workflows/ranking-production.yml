name: Deploy Cartigma ranking API (production)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "shared-clues.js"
      - "country-catalog.js"
      - "country-insights.js"
      - "currency-denominations.js"
      - ".github/workflows/ranking-production.yml"

permissions:
  contents: read

concurrency:
  group: cartigma-ranking-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'F404X/cartigma'
    name: Provision and verify production API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ranking-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURNSTILE_SITE_KEY: ${{ vars.CARTIGMA_TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET: ${{ secrets.CARTIGMA_TURNSTILE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run backend checks before publishing
        run: |
          set -euo pipefail
          node --check backend/src/index.js
          node --check backend/src/auth.js
          node --check backend/src/games.js
          node --check ranking-client.js
          node --test backend/tests/*.test.mjs
          node --test tests/*.test.mjs

      - name: Validate Cloudflare access and Turnstile configuration
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set CLOUDFLARE_API_TOKEN in GitHub environment ranking-production or repository secrets"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set CLOUDFLARE_ACCOUNT_ID in GitHub environment ranking-production or repository secrets"; exit 1; }
          if [ -n "$TURNSTILE_SITE_KEY" ] && [ -z "$TURNSTILE_SECRET" ] || [ -z "$TURNSTILE_SITE_KEY" ] && [ -n "$TURNSTILE_SECRET" ]; then
            echo "::error::Set both CARTIGMA_TURNSTILE_SITE_KEY (variable) and CARTIGMA_TURNSTILE_SECRET (secret), or neither"
            exit 1
          fi

      - name: Install Wrangler
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Reuse or provision the dedicated production D1 database
        working-directory: backend
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100" \
            > /tmp/cartigma-production-d1-list.json
          node --input-type=module - <<'JS'
          import fs from "node:fs";
          const data=JSON.parse(fs.readFileSync("/tmp/cartigma-production-d1-list.json","utf8"));
          if(!data.success)throw Error("Cloudflare D1 list request unsuccessful");
          const db=(data.result||[]).find(db=>db.name==="cartigma-ranking");
          fs.writeFileSync("/tmp/cartigma-production-d1-id",db?.uuid||db?.id||"");
          JS
          if [ ! -s /tmp/cartigma-production-d1-id ]; then
            curl --silent --show-error --fail --max-time 30 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"name":"cartigma-ranking"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
              > /tmp/cartigma-production-d1-new.json
            node --input-type=module - <<'JS'
          import fs from "node:fs";
          const data=JSON.parse(fs.readFileSync("/tmp/cartigma-production-d1-new.json","utf8"));
          if(!data.success)throw Error("Could not create production D1");
          fs.writeFileSync("/tmp/cartigma-production-d1-id",data.result?.uuid||data.result?.id||"");
          JS
          fi
          node --input-type=module - <<'JS'
          import fs from "node:fs";
          const uuid=fs.readFileSync("/tmp/cartigma-production-d1-id","utf8").trim();
          if(!/^[0-9a-f-]{36}$/i.test(uuid))throw Error("Production D1 ID invalid or unavailable");
          const template=fs.readFileSync("wrangler.production.toml","utf8");
          const placeholder="00000000-0000-0000-0000-000000000000";
          if(!template.includes(placeholder))throw Error("Expected D1 ID placeholder missing");
          let config=template.replace(placeholder,uuid);
          const sitekey=process.env.TURNSTILE_SITE_KEY;
          if(sitekey){
            if(!/^[A-Za-z0-9_-]+$/.test(sitekey))throw Error("Invalid Turnstile site key format");
            config+='\nTURNSTILE_SITE_KEY = "'+sitekey+'"\n';
          }
          fs.writeFileSync(".wrangler.production.ci.toml",config,{mode:0o600});
          console.log("Production D1 binding and optional Turnstile site key prepared");
          JS

      - name: Apply idempotent D1 schema and deploy the production hostname
        working-directory: backend
        run: |
          set -euo pipefail
          npx wrangler d1 execute cartigma-ranking --remote --file schema.sql --yes \
            --config .wrangler.production.ci.toml
          npx wrangler deploy --config .wrangler.production.ci.toml

      - name: Initialize missing Worker secrets without rotating existing credentials
        working-directory: backend
        run: |
          set -euo pipefail
          npx wrangler secret list --format=json --config .wrangler.production.ci.toml \
            > /tmp/cartigma-production-worker-secrets.json
          for key in AUTH_PEPPER GAME_SECRET; do
            if node --input-type=module - "$key" <<'JS'
          import fs from "node:fs";
          const key=process.argv[2];
          const data=JSON.parse(fs.readFileSync("/tmp/cartigma-production-worker-secrets.json","utf8"));
          if(!data.some(item=>item.name===key))process.exit(1);
          JS
            then
              echo "$key already exists; preserving the existing value"
            else
              openssl rand -hex 32 | npx wrangler secret put "$key" \
                --config .wrangler.production.ci.toml
              echo "$key securely initialized"
            fi
          done
          if [ -n "$TURNSTILE_SECRET" ]; then
            if node --input-type=module - <<'JS'
          import fs from "node:fs";
          const data=JSON.parse(fs.readFileSync("/tmp/cartigma-production-worker-secrets.json","utf8"));
          if(!data.some(item=>item.name==="TURNSTILE_SECRET"))process.exit(1);
          JS
            then
              echo "TURNSTILE_SECRET exists; not rotating it"
            else
              printf '%s' "$TURNSTILE_SECRET" | npx wrangler secret put TURNSTILE_SECRET \
                --config .wrangler.production.ci.toml
              echo "TURNSTILE_SECRET configured"
            fi
          fi

      - name: Verify real production API, database and browser CORS
        env:
          API: https://api.cartigma.f404x.net
          ORIGIN: https://cartigma.f404x.net
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          const api=process.env.API,origin=process.env.ORIGIN;
          const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function get(path){
            const response=await fetch(api+path,{headers:{Origin:origin},signal:AbortSignal.timeout(12000)});
            return {response,data:await response.json()};
          }
          let healthy=false;
          for(let attempt=0;attempt<6;attempt++){
            try{
              const {response,data}=await get("/v1/health");
              if(response.ok&&data.ok&&Object.values(data.checks||{}).every(Boolean)){
                healthy=true;
                break;
              }
              console.log("Health check returned",response.status,JSON.stringify(data));
            }catch(error){
              console.log("Health check not ready",String(error.message));
            }
            await pause(10000);
          }
          assert.ok(healthy,"Production API /v1/health failed: check DNS, Worker routes, D1 and secrets");
          const board=await get("/v1/leaderboards");
          assert.equal(board.response.status,200,"Leaderboard endpoint unavailable");
          assert.ok(Array.isArray(board.data.boards?.normal?.week),"Leaderboard payload is invalid");
          assert.equal(board.response.headers.get("access-control-allow-origin"),origin);
          assert.equal(board.response.headers.get("access-control-allow-credentials"),"true");
          const me=await get("/v1/auth/me");
          assert.equal(me.response.status,200,"Anonymous login/session probe failed");
          assert.equal(me.data.user,null);
          const preflight=await fetch(api+"/v1/auth/login",{
            method:"OPTIONS",
            headers:{Origin:origin,"Access-Control-Request-Method":"POST",
              "Access-Control-Request-Headers":"content-type"},
            signal:AbortSignal.timeout(12000)
          });
          assert.equal(preflight.status,204,"Browser login preflight failed");
          assert.equal(preflight.headers.get("access-control-allow-origin"),origin);
          const config=await get("/v1/config");
          assert.equal(config.response.status,200,"Turnstile config endpoint unavailable");
          console.log("PASS: production Worker, D1, leaderboard, login CORS and preflight");
          JS

      - name: Report production API URL
        if: success()
        run: |
          echo "Cartigma ranking API deployed at https://api.cartigma.f404x.net" >> "$GITHUB_STEP_SUMMARY"
          echo "D1 and Worker secrets retained across redeploys; staging left untouched." >> "$GITHUB_STEP_SUMMARY"
